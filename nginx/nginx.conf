worker_processes auto;

events {
  worker_connections 1024;
}

http {
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    application/json
    application/javascript
    text/css
    text/plain
    text/xml
    application/xml;

  # foundry.react's NEXT_PUBLIC_DRF=/api is a same-origin relative path (see
  # foundry.react/.env.production) - the browser expects one origin to serve both
  # the app and the API, split by path. This proxy is that origin.
  server {
    listen 80;

    # Docker's embedded DNS. Using variables for proxy_pass targets defers hostname
    # resolution to request time (not config load time), so nginx starts successfully
    # even when django/react aren't up yet and recovers automatically as they come up.
    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    location /api/ {
      set $django django:8000;
      proxy_pass http://$django;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # core/routing.py - Django Channels websocket consumers (bot, app version, help ticket)
    location /ws/ {
      set $django django:8000;
      proxy_pass http://$django;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    location / {
      set $react react:3000;
      proxy_pass http://$react;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
