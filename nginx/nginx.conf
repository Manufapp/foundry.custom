worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # foundry.react's NEXT_PUBLIC_DRF=/api is a same-origin relative path (see
  # foundry.react/.env.production) - the browser expects one origin to serve both
  # the app and the API, split by path. This proxy is that origin.
  server {
    listen 80;

    location /api/ {
      proxy_pass http://django:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # core/routing.py - Django Channels websocket consumers (bot, app version, help ticket)
    location /ws/ {
      proxy_pass http://django:8000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://react:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
